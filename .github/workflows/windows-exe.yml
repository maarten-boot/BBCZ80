# The Windows and Linux programs, bbc68k.exe and bbc68k (bare BBC BASIC in an
# emulated rosco_m68k), built and tested by src68k/tools/ci-windows.sh, as two
# artifacts.  Runs on every push to master (a merged pull request), and by
# hand: Actions > Windows and Linux programs > Run workflow.  The actions
# are pinned to commit hashes (their versions in the comments), all
# running on Node 24.
name: Windows and Linux programs

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: BBCZ80
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: maarten-boot/minix-st-2.0.4
          ref: feea47f05b8614ba5952b03c7c66f7170ce45ab0  # rosco-m68k, 2026-10-23
          path: minix-st-2.0.4
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: maarten-boot/r68k
          ref: 23f4e665855521d596780a8b921e9853d9cc4422  # main, with address errors (tested)
          path: r68k

      # retry a failed download (an Ubuntu mirror can be slow or down)
      - name: Build tools
        timeout-minutes: 40
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y flex bison ninja-build lua5.4 lua-posix zip dosfstools \
            g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix

      - name: ACK cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: minix-st-2.0.4/src/rosco/ack/ack
          key: ack-${{ hashFiles('minix-st-2.0.4/src/rosco/ack/build-ack.sh', 'minix-st-2.0.4/src/rosco/ack/ack-minix68k.patch') }}

      - name: Build and test
        run: BBCZ80/src68k/tools/ci-windows.sh "Version $(date -u '+%Y-%m-%d %H:%M') (commit ${GITHUB_SHA::7}, GitHub Actions run ${{ github.run_number }})"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: bbc68k-windows
          path: BBCZ80/build/dist/bbc68k-windows/

      # a tar.gz inside the artifact: the artifact's zip loses the executable bit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: bbc68k-linux
          path: BBCZ80/build/dist/bbc68k-linux.tar.gz
